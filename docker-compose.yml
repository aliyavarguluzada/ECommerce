services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-services.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build:
      context: .
      dockerfile: src/ECommerce.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ConnectionStrings__CatalogDatabase: "Host=postgres;Database=catalog_db;Username=ecommerce;Password=ecommerce"
    ports:
      - "127.0.0.1:5171:8080"
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    build:
      context: .
      dockerfile: src/ECommerce.Inventory.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ConnectionStrings__InventoryDatabase: "Host=postgres;Database=inventory_db;Username=ecommerce;Password=ecommerce"
      Services__Catalog: "http://catalog:8080/"
      ServiceAuth__Keys__Order: "${SERVICE_ORDER_KEY}"
    ports:
      - "127.0.0.1:5172:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started

  order:
    build:
      context: .
      dockerfile: src/ECommerce.Order.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ConnectionStrings__OrderDatabase: "Host=postgres;Database=order_db;Username=ecommerce;Password=ecommerce"
      Services__Catalog: "http://catalog:8080/"
      Services__Inventory: "http://inventory:8080/"
      Services__Payment: "http://payment:8080/"
      ServiceAuth__OutgoingKey: "${SERVICE_ORDER_KEY}"
      ServiceAuth__Keys__Cart: "${SERVICE_CART_KEY}"
      ServiceAuth__Keys__Payment: "${SERVICE_PAYMENT_KEY}"
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started

  identity:
    build:
      context: .
      dockerfile: src/ECommerce.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ConnectionStrings__IdentityDatabase: "Host=postgres;Database=identity_db;Username=ecommerce;Password=ecommerce"
      Auth__PrivateKey: "${AUTH_PRIVATE_KEY:?Initialize development keys}"
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      postgres:
        condition: service_healthy

  cart:
    build:
      context: .
      dockerfile: src/ECommerce.Cart.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ConnectionStrings__CartDatabase: "Host=postgres;Database=cart_db;Username=ecommerce;Password=ecommerce"
      Services__Catalog: "http://catalog:8080/"
      Services__Order: "http://order:8080/"
      ServiceAuth__OutgoingKey: "${SERVICE_CART_KEY}"
    ports:
      - "127.0.0.1:5175:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      order:
        condition: service_started

  payment:
    build:
      context: .
      dockerfile: src/ECommerce.Payment.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ConnectionStrings__PaymentDatabase: "Host=postgres;Database=payment_db;Username=ecommerce;Password=ecommerce"
      Services__Order: "http://order:8080/"
      ServiceAuth__OutgoingKey: "${SERVICE_PAYMENT_KEY}"
      ServiceAuth__Keys__Order: "${SERVICE_ORDER_KEY}"
      Payments__Provider: Development
    ports:
      - "127.0.0.1:5176:8080"
    depends_on:
      postgres:
        condition: service_healthy
      order:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: src/ECommerce.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Auth__PublicKey: "${AUTH_PUBLIC_KEY:?Run scripts/Initialize-Development.ps1 first}"
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: "http://catalog:8080/"
      ReverseProxy__Clusters__inventory__Destinations__primary__Address: "http://inventory:8080/"
      ReverseProxy__Clusters__order__Destinations__primary__Address: "http://order:8080/"
      ReverseProxy__Clusters__identity__Destinations__primary__Address: "http://identity:8080/"
      ReverseProxy__Clusters__cart__Destinations__primary__Address: "http://cart:8080/"
      ReverseProxy__Clusters__payment__Destinations__primary__Address: "http://payment:8080/"
    ports:
      - "127.0.0.1:5100:8080"
    depends_on:
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      order:
        condition: service_started
      identity:
        condition: service_started
      cart:
        condition: service_started
      payment:
        condition: service_started

volumes:
  postgres_data:
