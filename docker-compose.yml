services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build:
      context: .
      dockerfile: ECommerce.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__CatalogDatabase: "Host=postgres;Port=5432;Database=catalog_db;Username=ecommerce;Password=ecommerce"
    ports:
      - "127.0.0.1:5171:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
